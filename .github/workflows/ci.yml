name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgis image because alembic env.py does CREATE EXTENSION postgis.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: owmee
          POSTGRES_PASSWORD: owmee_dev_password
          POSTGRES_DB: owmee_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U owmee"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        # The app expects an authenticated Redis (see docker-compose.yml).
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://owmee:owmee_dev_password@localhost:5432/owmee_test
      SYNC_DATABASE_URL: postgresql://owmee:owmee_dev_password@localhost:5432/owmee_test
      # CI Redis runs without a password; override the conftest default.
      OWMEE_TEST_REDIS_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      R2_ENDPOINT: https://example.r2.cloudflarestorage.com
      R2_ACCESS_KEY: test
      R2_SECRET_KEY: test
      SECRET_KEY: ci-secret-not-for-prod-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: python -m pytest -q

  admin-typecheck:
    name: Admin type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
