services:
  - type: web
    name: owmee-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh /app/start.sh
    preDeployCommand: sh /app/predeploy.sh
    healthCheckPath: /health
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 60
    envVars:
      - key: ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: DATABASE_URL
        fromDatabase:
          name: owmee-postgres
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: owmee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: owmee-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: owmee-media
      - key: R2_EVIDENCE_BUCKET
        value: owmee-evidence
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_PUBLIC_ENDPOINT
        sync: false
      - key: TEMPORAL_HOST
        value: disabled
      - key: TEMPORAL_NAMESPACE
        value: default
      - key: TEMPORAL_API_KEY
        value: ""
      - key: ALLOWED_ORIGINS
        value: https://owmee-api.onrender.com
      - key: APP_BASE_URL
        value: https://owmee-api.onrender.com
      - key: OTP_WHITELIST
        sync: false
      - key: OTP_WHITELIST_CODE
        value: "123456"
      - key: SMS_PROVIDER
        value: mock
      - key: SMS_API_KEY
        value: ""
      - key: SMS_SENDER_ID
        value: OWMAPP
      - key: SMS_DLT_ENTITY_ID
        value: ""
      - key: KYC_PARTNER
        value: mock
      - key: KYC_PARTNER_API_KEY
        value: ""
      - key: KYC_PARTNER_BASE_URL
        value: ""
      - key: KYC_WEBHOOK_SECRET
        value: ""
      - key: PA_PROVIDER
        value: mock
      - key: PA_KEY_ID
        value: ""
      - key: PA_KEY_SECRET
        value: ""
      - key: PA_WEBHOOK_SECRET
        value: ""
      - key: STREAM_API_KEY
        value: ""
      - key: STREAM_API_SECRET
        value: ""
      - key: FCM_SERVER_KEY
        value: ""
      - key: SENTRY_DSN
        value: ""
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-3-pro-preview
      - key: GEMINI_TEXT_MODEL
        value: gemini-3-flash-preview

  - type: worker
    name: owmee-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh /app/worker.sh
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 60
    envVars:
      - key: ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "3"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: DATABASE_URL
        fromDatabase:
          name: owmee-postgres
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: owmee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: owmee-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: owmee-api
          envVarKey: SECRET_KEY
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: owmee-media
      - key: R2_EVIDENCE_BUCKET
        value: owmee-evidence
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_PUBLIC_ENDPOINT
        sync: false
      - key: TEMPORAL_HOST
        value: disabled
      - key: TEMPORAL_NAMESPACE
        value: default
      - key: TEMPORAL_API_KEY
        value: ""
      - key: ALLOWED_ORIGINS
        value: https://owmee-api.onrender.com
      - key: APP_BASE_URL
        value: https://owmee-api.onrender.com
      - key: SMS_PROVIDER
        value: mock
      - key: SMS_API_KEY
        value: ""
      - key: SMS_SENDER_ID
        value: OWMAPP
      - key: SMS_DLT_ENTITY_ID
        value: ""
      - key: KYC_PARTNER
        value: mock
      - key: KYC_PARTNER_API_KEY
        value: ""
      - key: KYC_PARTNER_BASE_URL
        value: ""
      - key: KYC_WEBHOOK_SECRET
        value: ""
      - key: PA_PROVIDER
        value: mock
      - key: PA_KEY_ID
        value: ""
      - key: PA_KEY_SECRET
        value: ""
      - key: PA_WEBHOOK_SECRET
        value: ""
      - key: STREAM_API_KEY
        value: ""
      - key: STREAM_API_SECRET
        value: ""
      - key: FCM_SERVER_KEY
        value: ""
      - key: SENTRY_DSN
        value: ""
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-3-pro-preview
      - key: GEMINI_TEXT_MODEL
        value: gemini-3-flash-preview

  - type: keyvalue
    name: owmee-redis
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: owmee-postgres
    databaseName: owmee
    user: owmee
    plan: basic-256mb
    region: singapore
    ipAllowList: []
    postgresMajorVersion: 16
