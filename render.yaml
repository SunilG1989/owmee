services:
  - type: web
    name: owmee-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh /app/start.sh
    preDeployCommand: sh /app/predeploy.sh
    healthCheckPath: /health
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 60
    envVars:
      - key: ENV
        value: production
      - key: STRICT_PROVIDER_STARTUP_VALIDATION
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: DATABASE_URL
        fromDatabase:
          name: owmee-postgres
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: owmee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: owmee-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: owmee-media
      - key: R2_EVIDENCE_BUCKET
        value: owmee-evidence
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_PUBLIC_ENDPOINT
        sync: false
      - key: TEMPORAL_HOST
        value: disabled
      - key: TEMPORAL_NAMESPACE
        value: default
      - key: TEMPORAL_API_KEY
        value: ""
      - key: ALLOWED_ORIGINS
        value: https://owmee-api.onrender.com
      - key: APP_BASE_URL
        value: https://owmee-api.onrender.com
      - key: OTP_WHITELIST
        sync: false
      - key: OTP_WHITELIST_CODE
        value: "123456"
      - key: SMS_PROVIDER
        value: msg91
      - key: SMS_API_BASE_URL
        value: https://control.msg91.com
      - key: SMS_API_KEY
        sync: false
      - key: SMS_TEMPLATE_ID
        sync: false
      - key: SMS_SENDER_ID
        value: OWMEO
      - key: SMS_DLT_ENTITY_ID
        sync: false
      - key: SMS_MSG91_TIMEOUT_SECONDS
        value: "10"
      - key: SMS_MSG91_OTP_EXPIRY_MINUTES
        value: "10"
      - key: KYC_PARTNER
        value: mock
      - key: KYC_PARTNER_API_KEY
        value: ""
      - key: KYC_PARTNER_BASE_URL
        value: ""
      - key: KYC_WEBHOOK_SECRET
        value: ""
      - key: FRAUD_PROVIDER
        value: mock
      - key: FRAUD_API_BASE_URL
        value: ""
      - key: FRAUD_API_KEY
        value: ""
      - key: FRAUD_WEBHOOK_SECRET
        value: ""
      - key: FRAUD_ONBOARDING_PATH
        value: /v1/onboarding/check
      - key: FRAUD_TIMEOUT_SECONDS
        value: "3"
      - key: FRAUD_DECISION_VALID_DAYS
        value: "30"
      - key: FRAUD_ENFORCEMENT_ENABLED
        value: "true"
      - key: HIGH_VALUE_VERIFICATION_THRESHOLD_INR
        value: "10000"
      - key: PA_PROVIDER
        value: mock
      - key: PA_KEY_ID
        value: ""
      - key: PA_KEY_SECRET
        value: ""
      - key: PA_WEBHOOK_SECRET
        value: ""
      - key: STREAM_API_KEY
        value: ""
      - key: STREAM_API_SECRET
        value: ""
      - key: FCM_SERVER_KEY
        value: ""
      - key: SENTRY_DSN
        value: ""
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_TEXT_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image-preview
      - key: IMAGE_CLEANUP_PROVIDER
        value: gemini
      - key: AI_DRAFT_FAST_PATH_ENABLED
        value: "true"
      - key: AI_DRAFT_FULL_FALLBACK_ENABLED
        value: "true"
      - key: AI_DRAFT_SHADOW_FULL_ANALYSIS_ENABLED
        value: "false"
      - key: AI_DRAFT_FAST_MIN_CATEGORY_CONFIDENCE
        value: "0.55"

  - type: worker
    name: owmee-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh /app/worker.sh
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 60
    envVars:
      - key: ENV
        value: production
      - key: STRICT_PROVIDER_STARTUP_VALIDATION
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "3"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: DATABASE_URL
        fromDatabase:
          name: owmee-postgres
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: owmee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: owmee-redis
          property: connectionString
      - key: HERO_CLEANUP_WORKER_CONCURRENCY
        value: "2"
      - key: HERO_CLEANUP_ENQUEUE_TIMEOUT_SECONDS
        value: "0.5"
      - key: HERO_CLEANUP_STREAM_MAXLEN
        value: "50000"
      - key: HERO_CLEANUP_RETRY_MAX_ATTEMPTS
        value: "4"
      - key: HERO_CLEANUP_PENDING_IDLE_SECONDS
        value: "180"
      - key: HERO_CLEANUP_READ_BLOCK_MS
        value: "2000"
      - key: AI_DRAFT_ANALYSIS_WORKER_CONCURRENCY
        value: "1"
      - key: AI_DRAFT_ANALYSIS_STREAM_MAXLEN
        value: "50000"
      - key: AI_DRAFT_ANALYSIS_RETRY_MAX_ATTEMPTS
        value: "3"
      - key: AI_DRAFT_ANALYSIS_READ_BLOCK_MS
        value: "2000"
      - key: SECRET_KEY
        fromService:
          type: web
          name: owmee-api
          envVarKey: SECRET_KEY
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: owmee-media
      - key: R2_EVIDENCE_BUCKET
        value: owmee-evidence
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_PUBLIC_ENDPOINT
        sync: false
      - key: TEMPORAL_HOST
        value: disabled
      - key: TEMPORAL_NAMESPACE
        value: default
      - key: TEMPORAL_API_KEY
        value: ""
      - key: ALLOWED_ORIGINS
        value: https://owmee-api.onrender.com
      - key: APP_BASE_URL
        value: https://owmee-api.onrender.com
      - key: SMS_PROVIDER
        value: msg91
      - key: SMS_API_BASE_URL
        value: https://control.msg91.com
      - key: SMS_API_KEY
        sync: false
      - key: SMS_TEMPLATE_ID
        sync: false
      - key: SMS_SENDER_ID
        value: OWMEO
      - key: SMS_DLT_ENTITY_ID
        sync: false
      - key: SMS_MSG91_TIMEOUT_SECONDS
        value: "10"
      - key: SMS_MSG91_OTP_EXPIRY_MINUTES
        value: "10"
      - key: KYC_PARTNER
        value: mock
      - key: KYC_PARTNER_API_KEY
        value: ""
      - key: KYC_PARTNER_BASE_URL
        value: ""
      - key: KYC_WEBHOOK_SECRET
        value: ""
      - key: FRAUD_PROVIDER
        value: mock
      - key: FRAUD_API_BASE_URL
        value: ""
      - key: FRAUD_API_KEY
        value: ""
      - key: FRAUD_WEBHOOK_SECRET
        value: ""
      - key: FRAUD_ONBOARDING_PATH
        value: /v1/onboarding/check
      - key: FRAUD_TIMEOUT_SECONDS
        value: "3"
      - key: FRAUD_DECISION_VALID_DAYS
        value: "30"
      - key: FRAUD_ENFORCEMENT_ENABLED
        value: "true"
      - key: HIGH_VALUE_VERIFICATION_THRESHOLD_INR
        value: "10000"
      - key: PA_PROVIDER
        value: mock
      - key: PA_KEY_ID
        value: ""
      - key: PA_KEY_SECRET
        value: ""
      - key: PA_WEBHOOK_SECRET
        value: ""
      - key: STREAM_API_KEY
        value: ""
      - key: STREAM_API_SECRET
        value: ""
      - key: FCM_SERVER_KEY
        value: ""
      - key: SENTRY_DSN
        value: ""
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_TEXT_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image-preview
      - key: IMAGE_CLEANUP_PROVIDER
        value: gemini
      - key: AI_DRAFT_FAST_PATH_ENABLED
        value: "true"
      - key: AI_DRAFT_FULL_FALLBACK_ENABLED
        value: "true"
      - key: AI_DRAFT_SHADOW_FULL_ANALYSIS_ENABLED
        value: "false"
      - key: AI_DRAFT_FAST_MIN_CATEGORY_CONFIDENCE
        value: "0.55"

  - type: keyvalue
    name: owmee-redis
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: owmee-postgres
    databaseName: owmee
    user: owmee
    plan: basic-256mb
    region: singapore
    ipAllowList: []
    postgresMajorVersion: 16
